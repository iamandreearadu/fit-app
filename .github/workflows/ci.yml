name: CI

on:
  push:
    branches: [main, Fix-Release]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FitApp.sln
      - run: dotnet build FitApp.sln -c Release --no-restore
      - run: dotnet test FitApp.Api.Tests/FitApp.Api.Tests.csproj -c Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fit-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fit-app/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build -- --configuration production

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f FitApp.Api/Dockerfile -t fitapp-api:${{ github.sha }} .
      - run: docker build -f fit-app/Dockerfile -t fitapp-frontend:${{ github.sha }} fit-app
