<div class="page-wrapper">
  <app-header></app-header>

  <div class="page-content">
    <div class="up-root">

      <!-- Mobile tab scroll row -->
      <div class="mob-tabs" aria-label="Account sections">
        @for (tab of tabs; track tab.id) {
          <a
            class="mob-tab"
            [routerLink]="tab.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            #mobileRoute="routerLinkActive"
            [attr.aria-current]="mobileRoute.isActive ? 'page' : null"
          >
            <mat-icon>{{ tab.icon }}</mat-icon><span>{{ tab.mobileLabel }}</span>
          </a>
        }
      </div>

      <div class="up-layout">

        <!-- Sidebar (desktop) -->
        <aside class="up-sidebar" [class.collapsed]="sidebarCollapsed">
          <div class="sb-user">
            <div class="sb-avatar">
              <img [src]="avatarUrl()" alt="Avatar" />
            </div>
            <div class="sb-info" *ngIf="!sidebarCollapsed">
              <span class="sb-name">{{ displayName() }}</span>
              <span class="sb-email">{{ displayEmail() }}</span>
            </div>
            <button class="sb-toggle" (click)="toggleSidebar()" type="button">
              <mat-icon>{{ sidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
            </button>
          </div>

          <!-- Streak mini-display -->
          <div *ngIf="!sidebarCollapsed && streak() as s" class="sb-streak" [class.at-risk]="s.atRisk">
            <mat-icon class="sb-flame-icon" [class.animated]="s.loggedToday && s.current > 0">local_fire_department</mat-icon>
            <div class="sb-streak-info">
              <span class="sb-streak-current">{{ s.current }}<span class="sb-streak-unit"> complete-day streak</span></span>
              <span *ngIf="s.longest > 1" class="sb-streak-best">Best: {{ s.longest }}d</span>
            </div>
            <span *ngIf="s.atRisk" class="sb-streak-risk-badge">AT RISK</span>
          </div>

          <nav class="sb-nav">
            @for (tab of tabs; track tab.id) {
              <a
                class="sb-item"
                [routerLink]="tab.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                #desktopRoute="routerLinkActive"
                [attr.aria-current]="desktopRoute.isActive ? 'page' : null"
                [attr.aria-label]="sidebarCollapsed ? tab.desktopLabel : null"
              >
                <mat-icon>{{ tab.icon }}</mat-icon>
                <span *ngIf="!sidebarCollapsed">{{ tab.desktopLabel }}</span>
              </a>
            }
          </nav>
        </aside>

        <!-- Main content -->
        <main class="up-content">
          <router-outlet />
        </main>
      </div>

    </div>
  </div>

  <app-footer></app-footer>
</div>
